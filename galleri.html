<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galleri</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="Header" id="Header-nav">
      <div class="Logobar">
        <div>
          <img src="images/Khåk logo.jxl" alt="Logo of khåk" id="logo" />
          <p>Galleri</p>
        </div>

        <!-- Spinning logo -->
        <div class="Video-container">
          <video
            src="images/Khåk logo spin.mp4"
            autoplay
            loop
            id="video2"
          ></video>
        </div>
      </div>
    </header>

    <!-- NAV bar -->
    <nav>
      <div class="container">
        <ul id="nav-row">
          <li><a href="index.html">Hovedside</a></li>
          <li><a href="galleri.html">Galleri</a></li>
          <li><a href="om-oss.html">Om oss</a></li>
          <li><a href="#Header-nav">Header</a></li>
          <li><a href="#footer-nav">Footer</a></li>
        </ul>
      </div>
    </nav>

    <!-- Main content -->
    <main>
      <banner
        ><img
          src="images/Banner-galleri.JPG"
          alt="Picture of 4 intricate paintings"
          class="banner-styling"
      /></banner>

      <!-- Gallery images -->
      <gallery>
        <div class="gallery-container">
          <img src="images/galleri1.jpg" alt="Logo of khåk" />

          <img src="images/galleri2.jpg" alt="Logo of khåk" />

          <img src="images/galleri3.jpg" alt="Logo of khåk" />

          <img src="images/galleri4.jpg" alt="Logo of khåk" />

          <img src="images/galleri5.jpg" alt="Logo of khåk" />

          <img src="images/galleri6.jpg" alt="Logo of khåk" />

          <img src="images/galleri7.jpg" alt="Logo of khåk" />

          <img src="images/galleri8.jpg" alt="Logo of khåk" />

          <img src="images/galleri9.jpg" alt="Logo of khåk" />

          <img src="images/galleri10.jpg" alt="Logo of khåk" />

          <img src="images/galleri11.jpg" alt="Logo of khåk" />

          <img src="images/galleri12.jpg" alt="Logo of khåk" />

          <img src="images/galleri13.jpg" alt="Logo of khåk" />

          <img src="images/galleri14.jpg" alt="Logo of khåk" />

          <img src="images/galleri16.jpg" alt="Logo of khåk" />
        </div>
      </gallery>
    </main>

    <!-- Footer bar -->
    <footer id="footer-nav" class="Footer-container">
      <div class="Opening-hours">
        Åpningstider
        <ul>
          <li>Tirsdag-Torsdag: 12-17</li>
          <li>Fredag-Lørdag: 12-16</li>
          <li>Mandag: STENGT</li>
        </ul>
      </div>
      <div>
        Bli med i nyhetsbrevet vårt!
        <form action="" class="email-container">
          <label for="Email">Nyhetsbrev</label>
          <input type="text" placeholder="Examplemail@gmail.com" />
          <button type="submit" class="button-styling">Abonner</button>
        </form>
      </div>
    </footer>
  </body>
</html>
